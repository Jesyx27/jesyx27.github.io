<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>A‑Frame Webviewer — sjabloon</title>
  <!-- A-Frame CDN -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <!-- Optioneel: extra componenten kunnen hier toegevoegd worden -->
  <style>
    /* Basisstijl zodat de canvas vol scherm gebruikt */
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: #111; /* valt weg zodra de a-scene geladen is */
    }

    /* Kleine UI-balk bovenin (optioneel) */
    .topbar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      color: white;
      pointer-events: none; /* laat klik-events door naar de scene */
      opacity: 0.9;
    }

    .topbar .title {
      background: rgba(0,0,0,0.5);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      pointer-events: none;
    }

    /* Maak de A-Frame canvas en container volledig scherm */
    a-scene {
      width: 100%;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Optionele UI: laat dit weg of bewaar als referentie -->
  <div class="topbar">
    <div class="title">A‑Frame Webviewer — sjabloon (lege scène)</div>
  </div>

  <!--
    Lege A-Frame scène. Voeg al je entities (modellen, licht, camera, interacties) tussen de <a-scene> tags toe.
    Voorbeeldplaatsen om iets toe te voegen:
      <!-- Plaats hier je 3D-modellen: <a-entity gltf-model="#mijnModel" position="0 0 -3"></a-entity> -->
  -->
  <a-scene vr-mode-ui="enabled: true">

    <!--
      TODO: voeg hier je content toe. Bijvoorbeeld:
        - camera / rig
        - lichtbronnen
        - glTF modellen
        - interactie-componenten
    -->

    <a-entity id="cameraRig">
      <a-entity camera look-controls position="0 1.6 0"></a-entity>
    </a-entity>

    <a-entity light="type: ambient; intensity: 0.5"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 1 0"></a-entity>

    <a-entity gltf-model="#exampleModel" position="0 0 -3" scale="1 1 1"></a-entity>

  </a-scene>


</body>
</html>
