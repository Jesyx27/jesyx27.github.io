<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>A‑Frame Webviewer — sjabloon</title>
  <!-- A-Frame CDN -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- Scripts van https://github.com/mwbeene/aframe-hdr-environment-map/tree/main -->
  <script src="lib/RGBELoader.js"></script>

  <script src="components/aframe-env-map-component.js"></script>
  <script src="components/aframe-hdr-environment.js"></script>
  

  <!-- Optioneel: extra componenten kunnen hier toegevoegd worden -->
  <style>
    /* Basisstijl zodat de canvas vol scherm gebruikt */
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: #111; /* valt weg zodra de a-scene geladen is */
    }

    .ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      color: white;
      font-size: 14px;
    }
    
    .laligndiv {
      background-color: rgba(0,0,0,0.5);
      width: 100%;
      margin: 5px;
      padding: 5px;
      border-radius: 5px;
      -moz-border-radius: 5px;
    }

    .around {
      width: 100%;
      overflow: hidden; /* will contain if #first is longer than #second */
    }

    p {
      border: none;
      color: white;
      padding: 8px 12px;
      margin: 4px;
      cursor: pointer;
      font-size: x-large;
      font-weight: bolder;
    }

    button {
      background: rgba(0,0,0,0.5);
      border: none;
      color: white;
      padding: 8px 12px;
      margin: 4px;
      border-radius: 4px;
      cursor: pointer;
      font-size:large;
    }
    button:hover {
      background: rgba(255,255,255,0.3);
      color: black;
      animation: button-hover 0.2s ease-in-out;
    }
    button:active {
      background: rgba(255,255,255,0.5);
      color: gray;
      animation: button-active 0.2s ease-in-out;
    }

    /* Animaties voor knoppen */
    @keyframes button-hover {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }


    /* Kleine UI-balk bovenin (optioneel) */
    .topbar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      color: white;
      pointer-events: none; /* laat klik-events door naar de scene */
      opacity: 0.9;
    }

    .topbar .title {
      background: rgba(0,0,0,0.5);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      pointer-events: none;
    }

    /* Maak de A-Frame canvas en container volledig scherm */
    a-scene {
      width: 100%;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>
  <!-- UI -->
  <ui class="ui">
    <div class="around">
      <div class="laligndiv">
        <!--<p>Visualisatiepositie</p>-->
        <button onclick="changeCamera('c_ovzt')">Overzicht</button>
        <button onclick="changeCamera('c_vdm-achtr')">v/d Mondestraat (achter)</button>
        <!--<button onclick="changeCamera('c_ms-achtr')">c_ms-achtr</button>-->
        <button onclick="changeCamera('c_bl-achtr')">Bucheliusstraat (achter)</button>
        <button onclick="changeCamera('c_gn-achtr')">Burmanstraat</button>
        <button onclick="changeCamera('c_brv-bovn')">Achertuin Melis Stokestraat</button>
        <button onclick="changeCamera('c_free-high')">Vrij Bewegen (hoog)</button>
        <button onclick="changeCamera('c_free-low')">Vrij Bewegen (laag)</button>
      </div>
        <button id="b_situatie" onclick="alterSituationChange()">Naar Nieuwe Situatie</button>
      </div>
    </div>
  </ui>

  <a-scene id="scene" shadow="type: pcfsoft" hdr-environment="url: assets/hdris/drakensberg_solitary_mountain_puresky_4k.hdr; showBackground: true; showGround: false; groundSize: 1000">
    <!-- ASSETS IMPORTEREN -->
    <a-assets>
      <a-asset-item id="mesh_huidig" src="assets/models/huidigesituatie/pgc_huidig.glb"></a-asset-item>
      <a-asset-item id="mesh_vloer" src="assets/models/huidigesituatie/pgc_vloer.glb"></a-asset-item>

      <a-asset-item id="mesh_n_pv_oranje" src="assets/models/pgc_n_pv_oranje.glb"></a-asset-item>
      <a-asset-item id="mesh_n_pv_blauw" src="assets/models/pgc_n_pv_blauw.glb"></a-asset-item>
      <a-asset-item id="mesh_n_bravo" src="assets/models/pgc_n_bravo.glb"></a-asset-item>
      <a-asset-item id="mesh_n_bravodek" src="assets/models/pgc_n_bravodek.glb"></a-asset-item>
      <a-asset-item id="mesh_n_cellullosevloer" src="assets/models/pgc_n_cellullosevloer.glb"></a-asset-item>
      <a-asset-item id="mesh_n_pur_istolatie" src="assets/models/pgc_n_pur_istolatie.glb"></a-asset-item>
      <a-asset-item id="mesh_n_vacuumvloer" src="assets/models/pgc_n_vacuumvloer.glb"></a-asset-item>
      <a-asset-item id="mesh_n_tussenvloer" src="assets/models/pgc_n_tussenvloer.glb"></a-asset-item>

    </a-assets>

    <!-- BELICHTING -->
    <a-entity light="type: ambient; intensity: 0.5;"></a-entity>
    <a-entity id="sun" light="type: directional;
                    castShadow: true;
                    shadowBias: -0.00005;
                    intensity: 5;
                    shadowCameraNear: 1;
                    shadowCameraFar: 500;
                    shadowCameraLeft: -100;
                    shadowCameraRight: 100;
                    shadowCameraTop: 100;
                    shadowCameraBottom: -100;
                    shadowMapHeight: 2048;
                    shadowMapWidth: 2048;"
              sun-position="azimuth: 50; altitude: 45; distance: 150">
    </a-entity>

    <!-- CAMERA'S -->
    <a-entity rotation="0.5 -90 0" position="5 25 0">
      <a-entity id="c_ovzt" camera="active: true" look-controls></a-entity>
    </a-entity>
    <a-entity rotation="0 5 0" position="-28 2 33">
      <a-entity id="c_vdm-achtr" camera="active: false" look-controls ></a-entity>
    </a-entity>
    <a-entity rotation="0 7 0" position="16 2 45">
      <a-entity id="c_bl-achtr" camera="active: false" look-controls ></a-entity>
    </a-entity>
    <a-entity rotation="0 -55 0" position="55 2 -39">
      <a-entity id="c_gn-achtr" camera="active: false" look-controls  ></a-entity>
    </a-entity>
    <a-entity rotation="0.5 -65 0" position="-10 3 75">
      <a-entity id="c_brv-bovn" camera="active: false" look-controls ></a-entity>
    </a-entity>
    <a-entity rotation="0.5 170 0" position="-2 10 0">
      <a-entity id="c_free-high" camera="active: false" look-controls wasd-controls ></a-entity>
    </a-entity>
    <a-entity rotation="0.5 170 0" position="-2 1.8 0">
      <a-entity id="c_free-low" camera="active: false" look-controls wasd-controls ></a-entity>
    </a-entity>

    <!-- 3D-MODELLEN -->
    <a-entity id="huidig" gltf-model="#mesh_huidig" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="receive: true"></a-entity>></a-entity>
    <a-entity id="vloer" gltf-model="#mesh_vloer" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="receive: true"></a-entity>></a-entity>
    
    <a-entity id="n_pv_oranje" visible="false" gltf-model="#mesh_n_pv_oranje" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="receive: true"></a-entity>></a-entity>
    <a-entity id="n_pv_blauw" visible="false" gltf-model="#mesh_n_pv_blauw" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="receive: true"></a-entity>></a-entity>
    <a-entity id="n_bravo" visible="false" gltf-model="#mesh_n_bravo" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="receive: true"></a-entity>></a-entity>
    <a-entity id="n_bravodek" visible="false" gltf-model="#mesh_n_bravodek" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="cast: true; receive: true"></a-entity>></a-entity>
    <a-entity id="n_cellullosevloer" visible="false" gltf-model="#mesh_n_cellullosevloer" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="cast: true; receive: true"></a-entity>></a-entity>
    <a-entity id="n_pur_istolatie" visible="false" gltf-model="#mesh_n_pur_istolatie" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="cast: true; receive: true"></a-entity>></a-entity>
    <a-entity id="n_vacuumvloer" visible="false" gltf-model="#mesh_n_vacuumvloer" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="cast: true; receive: true"></a-entity>></a-entity>
    <a-entity id="n_tussenvloer" visible="false" gltf-model="#mesh_n_tussenvloer" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="receive: true"></a-entity>></a-entity>
    
    <!-- TEXT -->
    <a-text id="t_ovzt" visible="true"
      font="assets/fonts/Roboto-Regular-msdf.json"
      negate="false"
      value="Welkom bij de webviewer van het Tuinwijk-west renovatieproject. Op deze website worden de geplande renovaties openbaar gesteld. 
      \nEr worden zonnepanelen, beter geïsoleerd glas en een centrale verwarmingseenheid (IO-Bravo) geplaatst. Daarnaast worden alle woningen in het projectgebied voorzien van een cellulose- of vacuümvloer, een tussenvloer en tot slot pur- & dakisolatie. Voor het renovatieproject is het mediaanenergielabel 'E', maar na de renovatie heeft elke woning een energielabel van 'B' of hoger.
      \nDe renovaties, en hun invloed op het uiterlijk van de buurt kunnen afgebeeld worden in verschillende zichthoeken; gebruik hiervoor de bovenstaande knoppen. Ook kan er tussen de oude en de nieuwe situatie omgeschakeld worden met de knop 'Naar Nieuwe/Oude Situatie'. Tot slot kan er rondgekeken worden met de muis, in de 'Vrij Bewegen' cameramodi met de knoppen 'W', 'A', 'S' & 'D'" 
      align="center" color="black" width="250" wrap-count="70" position="200 80 0" rotation="0 -90 0">
    </a-text>
    <a-text id="t_vdm-achtr" visible="false"
      font="assets/fonts/Roboto-Regular-msdf.json"
      negate="false"
      value="Veel woningen in het projectgebied krijgen zonnepanelen, in totaal zijn dit er 522.\n\nAl die panelen leveren samen ~205.000 kWh per jaar op \nDat is genoeg om meer dan de helft van het projectgebied te voorzien." 
      color="LightYellow" width="35" wrap-count="45" position="-55 22 -3" rotation="10 10 0">
    </a-text>
    <a-text id="t_bl-achtr" visible="false"
      font="assets/fonts/Roboto-Regular-msdf.json"
      negate="false"
      value="Met 91 zonnepanelen die dezelfde kleur hebben als het dak, kan het karakter van de wijk zo gelijk mogelijk blijven.\n\nDeze worden geplaatst op plekken die vanaf het straatbeeld goed zichtbaar zijn. Zoals hier op de oosterlijke achterdaken van de Bucheliusstraat" 
      color="white" width="35" wrap-count="45" position="0 25 0" rotation="10 0 0">
    </a-text>
    <a-text id="t_gn-achtr" visible="false"
      font="assets/fonts/Roboto-Regular-msdf.json"
      negate="false"
      value="Ook hier op de achterdaken van de Gerard Noodstraat, zichbaar van de Burmanstraat, is er gekozen voor zonnepanelen met dezelfde kleur als het dak.\n\nDe blauwe zonnepanelen zijn vanaf de straat nauwelijks zichtbaar door de bosschage" 
      color="white" width="35" wrap-count="45" position="65 25 -79" rotation="10 -40 0">
    </a-text>
    <a-text id="t_brv-bovn" visible="false"
      font="assets/fonts/Roboto-Regular-msdf.json"
      negate="false"
      value="In de achtertuin van de woningen aan de Melis Stokestraat worden de modules 'IO-Bravo' geplaatst.
      \n\nDe io Bravo is een duurzaam systeem dat warmte uit de buitenlucht haalt en deze gebruikt om woningen en het water te verwarmen. Het werkt op elektriciteit, maar levert veel meer warmte op dan het verbruikt en stoot geen fossiele brandstoffen uit, waardoor er minder CO₂ vrijkomt. De warmte wordt via leidingen naar alle woningen gebracht. Als er tijdelijk meer energie beschikbaar is, bijvoorbeeld door zonlicht, kan het systeem warmte opslaan om later te gebruiken. De io Foxtrot zorgt ervoor dat alles slim wordt aangestuurd door gegevens over het weer, het energieverbruik en de energieprijzen te gebruiken, zodat het systeem zo efficiënt mogelijk werkt." 
      color="black" width="15" wrap-count="55" position="0 10 65" rotation="20 -65 0">
    </a-text>
  </a-scene>
  
</body>
</html>
<script>
AFRAME.registerComponent('sun-position', {
  schema: {
    azimuth: { type: 'number', default: 45 },   // degrees
    altitude: { type: 'number', default: 45 },  // degrees
    distance: { type: 'number', default: 50 }
  },

  update() {
    const az = THREE.MathUtils.degToRad(this.data.azimuth);
    const alt = THREE.MathUtils.degToRad(this.data.altitude);
    const r = this.data.distance;

    const x = r * Math.cos(alt) * Math.sin(az);
    const y = r * Math.sin(alt);
    const z = r * Math.cos(alt) * Math.cos(az);

    this.el.setAttribute('position', { x, y, z });
  }
});
</script>
<script>
  var oudeSituatie = true;
  var skyboxIndex = 0;
  var skyboxID = 'hdr-environment';
  var skyboxSuffix = '; showBackground: true; showGround: true; groundSize: 1000';
  var skyboxPrefix = 'url: ';
  var situationButtonTexts = ['Naar Nieuwe Situatie', 'Naar Oude Situatie'];

  // Zet het als de standaard op de oude situatie
  document.getElementById("b_situatie").innerHTML = situationButtonTexts[+!oudeSituatie]


  function alterSituationChange() {
    let scene = document.getElementById("scene");
    let b_situatie = document.getElementById("b_situatie");

    changeVisibility("n_pv_oranje", oudeSituatie, scene);
    changeVisibility("n_pv_blauw", oudeSituatie, scene);
    changeVisibility("n_bravo", oudeSituatie, scene);
    changeVisibility("n_bravodek", oudeSituatie, scene);
    changeVisibility("n_cellullosevloer", oudeSituatie, scene);
    changeVisibility("n_pur_istolatie", oudeSituatie, scene);
    changeVisibility("n_vacuumvloer", oudeSituatie, scene);
    changeVisibility("n_tussenvloer", oudeSituatie, scene);

    console.log(situationButtonTexts[+oudeSituatie]);
    b_situatie.innerHTML = situationButtonTexts[+oudeSituatie];
    oudeSituatie = !oudeSituatie;
  }

  function changeCamera(toCamera) {
    document.querySelector('#c_ovzt').setAttribute('camera', 'active', toCamera == "c_ovzt");
    document.querySelector('#c_vdm-achtr').setAttribute('camera', 'active', toCamera == "c_vdm-achtr");
    document.querySelector('#c_bl-achtr').setAttribute('camera', 'active', toCamera == "c_bl-achtr");
    document.querySelector('#c_gn-achtr').setAttribute('camera', 'active', toCamera == "c_gn-achtr");
    document.querySelector('#c_brv-bovn').setAttribute('camera', 'active', toCamera == "c_brv-bovn");
    document.querySelector('#c_free-high').setAttribute('camera', 'active', toCamera == "c_free-high");
    document.querySelector('#c_free-low').setAttribute('camera', 'active', toCamera == "c_free-low");

    document.querySelector('#t_ovzt').setAttribute('visible', toCamera == "c_ovzt");
    document.querySelector('#t_vdm-achtr').setAttribute('visible', toCamera == "c_vdm-achtr");
    document.querySelector('#t_bl-achtr').setAttribute('visible', toCamera == "c_bl-achtr");
    document.querySelector('#t_gn-achtr').setAttribute('visible', toCamera == "c_gn-achtr");
    document.querySelector('#t_brv-bovn').setAttribute('visible', toCamera == "c_brv-bovn");
  }

  function changeVisibility(modelName, visible, scene) {
    
    model = scene.querySelector("#".concat(modelName));
    model.setAttribute("visible", visible);
  }

  function toggleModel(modelName) {
    let scene = document.getElementById("scene");

    let model = scene.querySelector("#".concat(modelName));
    let currentVisibility = model.getAttribute("visible");
    model.setAttribute("visible", !currentVisibility);
  }
  

</script>
