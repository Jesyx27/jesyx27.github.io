<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>A‑Frame Webviewer — sjabloon</title>
  <!-- A-Frame CDN -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- Scripts van https://github.com/mwbeene/aframe-hdr-environment-map/tree/main -->
  <script src="lib/RGBELoader.js"></script>

  <script src="components/aframe-env-map-component.js"></script>
  <script src="components/aframe-hdr-environment.js"></script>

  <!-- Optioneel: extra componenten kunnen hier toegevoegd worden -->
  <style>
    /* Basisstijl zodat de canvas vol scherm gebruikt */
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: #111; /* valt weg zodra de a-scene geladen is */
    }

    /* Kleine UI-balk bovenin (optioneel) */
    .topbar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      color: white;
      pointer-events: none; /* laat klik-events door naar de scene */
      opacity: 0.9;
    }

    .topbar .title {
      background: rgba(0,0,0,0.5);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      pointer-events: none;
    }

    /* Maak de A-Frame canvas en container volledig scherm */
    a-scene {
      width: 100%;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="title">Utrecht Science Park met Oblisk - Jesse Ceulemans</div>
  </div>

  <a-scene id="scene" light="defaultLightsEnabled: true" hdr-environment="url: assets/hdris/sunflowers_puresky_4k.hdr; showBackground: true; showGround: true; groundSize: 1000">
    <a-entity camera look-controls wasd-controls="acceleration: 1000" position="-30 40 100"></a-entity>
    <a-assets>
      <a-asset-item id="obj_usp" src="assets/models/usp/Collada-RD-139900_455000.obj"></a-asset-item>
      <a-asset-item id="mtl_usp" src="assets/models/usp/Collada-RD-139900_455000.mtl"></a-asset-item>
      <a-asset-item id="obj_oblisk" src="assets/models/oblisk/oblisk.obj"></a-asset-item>
      <a-asset-item id="mtl_oblisk" src="assets/models/oblisk/oblisk.mtl"></a-asset-item>
    </a-assets>

    <a-entity obj-model="obj: #obj_usp; mtl: #mtl_usp" rotation="-90 0 0" position="-200 20 100"></a-entity>
    <a-entity id="oblisk" obj-model="obj: #obj_oblisk; mtl: #mtl_oblisk" rotation="0 0 0" position="-18 25 45" scale="2 2 2"></a-entity>
  </a-scene>

</body>
</html>
