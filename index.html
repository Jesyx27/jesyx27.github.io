<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>A‑Frame Webviewer — sjabloon</title>
  <!-- A-Frame CDN -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- Scripts van https://github.com/mwbeene/aframe-hdr-environment-map/tree/main -->
  <script src="lib/RGBELoader.js"></script>

  <script src="components/aframe-env-map-component.js"></script>
  <script src="components/aframe-hdr-environment.js"></script>
  

  <!-- Optioneel: extra componenten kunnen hier toegevoegd worden -->
  <style>
    /* Basisstijl zodat de canvas vol scherm gebruikt */
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: #111; /* valt weg zodra de a-scene geladen is */
    }

    .ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      color: white;
      font-size: 14px;
    }

    button {
      background: rgba(0,0,0,0.5);
      border: none;
      color: white;
      padding: 8px 12px;
      margin: 4px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: rgba(255,255,255,0.3);
      color: black;
      animation: button-hover 0.2s ease-in-out;
    }
    button:active {
      background: rgba(255,255,255,0.5);
      color: gray;
      animation: button-active 0.2s ease-in-out;
    }

    /* Animaties voor knoppen */
    @keyframes button-hover {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }


    /* Kleine UI-balk bovenin (optioneel) */
    .topbar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      color: white;
      pointer-events: none; /* laat klik-events door naar de scene */
      opacity: 0.9;
    }

    .topbar .title {
      background: rgba(0,0,0,0.5);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      pointer-events: none;
    }

    /* Maak de A-Frame canvas en container volledig scherm */
    a-scene {
      width: 100%;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>
  <ui class="ui">
    <!-- Optionele UI-elementen kunnen hier geplaatst worden 
    <button onclick="change_hdri()">Andere Lucht</button>-->
    <button onclick="alter_situation_change()">Oude/Nieuwe Situatie</button>
  </ui>

  <!--hdr-environment="url: assets/hdris/citrus_orchard_road_puresky_4k.hdr; showBackground: true; showGround: false; groundSize: 1000"-->
  <a-scene id="scene" shadow="type: pcfsoft" hdr-environment="url: assets/hdris/sunflowers_puresky_4k.hdr; showBackground: true; showGround: false; groundSize: 1000">
    <a-assets>
      <a-asset-item id="mesh_huidig" src="assets/models/huidigesituatie/pgc_huidig.glb"></a-asset-item>
      <a-asset-item id="mesh_vloer" src="assets/models/huidigesituatie/pgc_vloer.glb"></a-asset-item>

      <a-asset-item id="mesh_n_pv_oranje" src="assets/models/pgc_n_pv_oranje.glb"></a-asset-item>
      <a-asset-item id="mesh_n_pv_blauw" src="assets/models/pgc_n_pv_blauw.glb"></a-asset-item>
      <a-asset-item id="mesh_n_bravo" src="assets/models/pgc_n_bravo.glb"></a-asset-item>
      <a-asset-item id="mesh_n_bravodek" src="assets/models/pgc_n_bravodek.glb"></a-asset-item>
      <a-asset-item id="mesh_n_cellullosevloer" src="assets/models/pgc_n_cellullosevloer.glb"></a-asset-item>
      <a-asset-item id="mesh_n_pur_istolatie" src="assets/models/pgc_n_pur_istolatie.glb"></a-asset-item>
      <a-asset-item id="mesh_n_vacuumvloer" src="assets/models/pgc_n_vacuumvloer.glb"></a-asset-item>
      <a-asset-item id="mesh_n_tussenvloer" src="assets/models/pgc_n_tussenvloer.glb"></a-asset-item>

    </a-assets>

    <a-entity light="type: ambient; intensity: 0.5;"></a-entity>
    <a-entity id="sun" light="type: directional;
                    castShadow: true;
                    intensity: 10;
                    shadowCameraNear: 1;
                    shadowCameraFar: 300;
                    shadowCameraLeft: -100;
                    shadowCameraRight: 100;
                    shadowCameraTop: 100;
                    shadowCameraBottom: -100;
                    shadowMapHeight: 2048;
                    shadowMapWidth: 2048;
              sun-position="azimuth: 50; altitude: 50; distance: 150">
    </a-entity>


    <a-entity camera="active: false" look-controls wasd-controls position="0 1.6 0" data-aframe-default-camera></a-entity>
    <a-entity camera="active: true" look-controls wasd-controls position="0 40 0" data-aframe-default-camera></a-entity>

    <!--<a-entity obj-model="obj: #huidig-obj; mtl: #huidig-mtl" scale="1 1 1"></a-entity>-->
    <a-entity id="huidig" gltf-model="#mesh_huidig" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="receive: true"></a-entity>></a-entity>
    <a-entity id="vloer" gltf-model="#mesh_vloer" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="receive: true"></a-entity>></a-entity>
    
    <a-entity id="n_pv_oranje" gltf-model="#mesh_n_pv_oranje" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="receive: true"></a-entity>></a-entity>
    <a-entity id="n_pv_blauw" gltf-model="#mesh_n_pv_blauw" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="receive: true"></a-entity>></a-entity>
    <a-entity id="n_bravo" gltf-model="#mesh_n_bravo" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="receive: true"></a-entity>></a-entity>
    <a-entity id="n_bravodek" gltf-model="#mesh_n_bravodek" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="cast: true; receive: true"></a-entity>></a-entity>
    <a-entity id="n_cellullosevloer" gltf-model="#mesh_n_cellullosevloer" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="cast: true; receive: true"></a-entity>></a-entity>
    <a-entity id="n_pur_istolatie" gltf-model="#mesh_n_pur_istolatie" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="cast: true; receive: true"></a-entity>></a-entity>
    <a-entity id="n_vacuumvloer" gltf-model="#mesh_n_vacuumvloer" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="cast: true; receive: true"></a-entity>></a-entity>
    <a-entity id="n_tussenvloer" gltf-model="#mesh_n_tussenvloer" scale="1 1 1" position="4 0 0" rotation="0 0 0" shadow="receive: true"></a-entity>></a-entity>
  
  </a-scene>
  
</body>
</html>
<script>
AFRAME.registerComponent('sun-position', {
  schema: {
    azimuth: { type: 'number', default: 45 },   // degrees
    altitude: { type: 'number', default: 45 },  // degrees
    distance: { type: 'number', default: 50 }
  },

  update() {
    const az = THREE.MathUtils.degToRad(this.data.azimuth);
    const alt = THREE.MathUtils.degToRad(this.data.altitude);
    const r = this.data.distance;

    const x = r * Math.cos(alt) * Math.sin(az);
    const y = r * Math.sin(alt);
    const z = r * Math.cos(alt) * Math.cos(az);

    this.el.setAttribute('position', { x, y, z });
  }
});
</script>
<script>
  var oudeSituatie = false;
  var skyboxIndex = 0;
  var skyboxID = 'hdr-environment';
  var skyboxSuffix = '; showBackground: true; showGround: true; groundSize: 1000';
  var skyboxPrefix = 'url: ';
  var skyboxes = [
      'assets/hdris/sunflowers_puresky_4k.hdr',
      'assets/hdris/citrus_orchard_road_puresky_4k.hdr',
      'assets/hdris/belfast_sunset_puresky_4k.hdr',
      'assets/hdris/overcast_soil_puresky_4k.hdr',
      'assets/hdris/qwantani_night_puresky_4k.hdr',
      'assets/hdris/syferfontein_0d_clear_puresky_4k.hdr'
  ];

  function change_hdri() {
      let scene = document.getElementById("scene");

      skyboxIndex = (skyboxIndex + 1) % skyboxes.length;
      let hdr = skyboxes[skyboxIndex];

      // Verwijder het component
      scene.removeAttribute("hdr-environment");

      // Force A-Frame to process the removal before re-adding
      setTimeout(() => {
          scene.setAttribute(
              "hdr-environment",
              `url: ${hdr}; showBackground: true; showGround: false; groundSize: 1000;`
          );

          console.log("HDR changed to:", hdr);
      }, 10);
  }

  function alter_situation_change() {
    changeVisibility("n_pv_oranje", oudeSituatie);
    changeVisibility("n_pv_blauw", oudeSituatie);
    changeVisibility("n_bravo", oudeSituatie);
    changeVisibility("n_bravodek", oudeSituatie);
    changeVisibility("n_cellullosevloer", oudeSituatie);
    changeVisibility("n_pur_istolatie", oudeSituatie);
    changeVisibility("n_vacuumvloer", oudeSituatie);

    oudeSituatie = !oudeSituatie
  }

  function changeVisibility(modelName, visible) {
    let scene = document.getElementById("scene");
    model = scene.querySelector("#".concat(modelName));
    model.setAttribute("visible", visible);
  }

  function toggle_model(modelName) {
    let scene = document.getElementById("scene");

    let model = scene.querySelector("#".concat(modelName));
    let currentVisibility = model.getAttribute("visible");
    model.setAttribute("visible", !currentVisibility);
  }
  

</script>
