<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>A‑Frame Webviewer — sjabloon</title>
  <!-- A-Frame CDN -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <!-- Optioneel: extra componenten kunnen hier toegevoegd worden -->
  <style>
    /* Basisstijl zodat de canvas vol scherm gebruikt */
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: #111; /* valt weg zodra de a-scene geladen is */
    }

    /* Kleine UI-balk bovenin (optioneel) */
    .topbar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      color: white;
      pointer-events: none; /* laat klik-events door naar de scene */
      opacity: 0.9;
    }

    .topbar .title {
      background: rgba(0,0,0,0.5);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      pointer-events: none;
    }

    /* Maak de A-Frame canvas en container volledig scherm */
    a-scene {
      width: 100%;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Optionele UI: laat dit weg of bewaar als referentie -->
  <div class="topbar">
    <div class="title">A‑Frame Webviewer — sjabloon (lege scène)</div>
  </div>

  <a-scene fog="type: linear; color: #100; near: 10; far: 1000" background="color: #67a">
    <a-entity camera look-controls wasd-controls="acceleration: 1000" position="0 50 0"></a-entity>
    <a-assets>
      <a-asset-item id="obj" src="assets/models/usp/Collada-RD-139900_455000.obj"></a-asset-item>
      <a-asset-item id="mtl" src="assets/models/usp/Collada-RD-139900_455000.mtl"></a-asset-item>
    </a-assets>

    <a-entity obj-model="obj: #obj; mtl: #mtl" rotation="-90 0 0" position="0 0 0"></a-entity>
  </a-scene>

</body>
</html>
